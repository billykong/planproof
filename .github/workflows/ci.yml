# Unit tests, the kernel's budgets and a short fuzz run, on every pull
# request and on main. Nothing here needs a cluster or a secret.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - run: make fmt-check vet test budget cover examples results-check
    - run: make fuzz FUZZTIME=60s
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - name: Install elan (the toolchain comes from lean/lean-toolchain)
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
        sh elan-init.sh -y --no-modify-path --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    - run: make lean
