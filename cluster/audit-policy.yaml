# API audit policy for the lab cluster: the writes the translation check
# (C-17) compares with the executor's compiled plan. Request level keeps the
# patch body, so the check sees which fields a patch touched, not just that
# it happened (GAP-01).
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
- level: Request
  verbs: [create, update, patch, delete, deletecollection]
  resources:
  - group: ""
    resources: [nodes, pods, pods/eviction]
  - group: apps
    resources: [deployments, deployments/scale]
- level: None
